apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 945253721395.dkr.ecr.us-east-1.amazonaws.com/backend-crm:latest
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "my-database.cijak4w6yvin.us-east-1.rds.amazonaws.com"

        - name: DB_USER
          value: "postgres"

        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: POSTGRES_DB

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
            

